name: Publish tagged Android APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - run: npx cap add android
      - run: bash scripts/patch-android.sh
      - run: npx cap sync android
      - name: Assemble debug-signed APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - name: Publish APK on the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="Hirkani-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --generate-notes --title "Hirkani $TAG"
          fi
