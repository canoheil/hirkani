name: Build Android debug APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Capacitor Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor 6 dependencies
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Lock landscape and immersive fullscreen
        run: node scripts/configure-android.cjs

      - name: Sync web app
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hirkani-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
